<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log anomaly detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #eef1f4; --panel: #ffffff; --ink: #18202b; --muted: #5e6b7a;
  --grid: #d3dae2; --trace: #2350b8; --band: #c9d6f0;
  --low: #a67c00; --medium: #cf6310; --high: #c0352b; --critical: #7c1234;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12171e; --panel: #19202a; --ink: #e6ebf1; --muted: #93a0b0;
    --grid: #2a3441; --trace: #7ea2f2; --band: #26365a;
    --low: #d6aa2a; --medium: #f08a3a; --high: #f0645a; --critical: #e0537d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

header { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
h1 { font-size: 1.35rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.status { display: flex; gap: 22px; color: var(--muted); font-size: 0.9rem; }
.status strong { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.live { background: #2e9b5a; }
.dot.poll { background: var(--low); }

.recorder { background: var(--panel); border: 1px solid var(--grid); border-radius: 6px; padding: 14px 14px 8px; }
.recorder canvas { display: block; width: 100%; height: 300px; }
.legend { display: flex; gap: 20px; font-size: 0.82rem; color: var(--muted); padding: 6px 4px 2px; }
.swatch { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; }

h2 { font-size: 1rem; font-weight: 600; margin: 34px 0 10px; }
h2 span { color: var(--muted); font-weight: 400; }
#feed { list-style: none; margin: 0; padding: 0; }
.alert { background: var(--panel); border: 1px solid var(--grid); border-left: 4px solid var(--c); border-radius: 4px; margin-bottom: 8px; }
.alert.fresh { animation: arrive 1.4s ease-out; }
@keyframes arrive { from { background: color-mix(in srgb, var(--c) 18%, var(--panel)); } }
.alert summary { display: grid; grid-template-columns: 7.5rem 6rem 1fr auto; gap: 12px; align-items: baseline; padding: 10px 14px; cursor: pointer; list-style: none; }
.alert summary::-webkit-details-marker { display: none; }
.alert summary:focus-visible { outline: 2px solid var(--trace); outline-offset: 2px; }
.sev { color: var(--c); font-weight: 600; }
.time { color: var(--muted); font-variant-numeric: tabular-nums; }
.nums { font-variant-numeric: tabular-nums; }
.z { color: var(--muted); font-size: 0.85rem; }
.alert pre { margin: 0; padding: 10px 14px 12px; border-top: 1px solid var(--grid); font: 12.5px/1.6 var(--mono); color: var(--muted); overflow-x: auto; }
.empty { color: var(--muted); padding: 18px 0; }

@media (max-width: 640px) {
  .alert summary { grid-template-columns: 1fr auto; }
  .alert .nums { grid-column: 1 / -1; }
  .recorder canvas { height: 220px; }
}
@media (prefers-reduced-motion: reduce) { .alert.fresh { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Log anomaly detector</h1>
    <div class="status">
      <span><span class="dot" id="conn-dot"></span><span id="conn">Connecting</span></span>
      <span>Error rate <strong id="rate">–</strong></span>
      <span id="baseline-wrap">Baseline <strong id="baseline">learning</strong></span>
    </div>
  </header>

  <section class="recorder" aria-label="Error rate over the last five minutes">
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><span class="swatch" style="background:var(--trace)"></span>Error rate, 60 s window</span>
      <span><span class="swatch" style="background:var(--band);height:10px"></span>Normal range</span>
    </div>
  </section>

  <h2>Alerts <span id="count"></span></h2>
  <ul id="feed"><li class="empty">No anomalies yet. Alerts appear here the moment the error rate breaks from its normal range.</li></ul>
</main>

<script>
const SPAN_SEC = 300;
const state = { metrics: [], alerts: [], ws: null, pollTimer: null };
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pct = x => (x * 100).toFixed(1) + "%";
const sevLabel = s => s.charAt(0) + s.slice(1).toLowerCase();
const sevVar = s => `var(--${s.toLowerCase()})`;
const clock = ts => new Date(ts * 1000).toLocaleTimeString();

function setConn(mode) {
  $("conn-dot").className = "dot " + (mode === "live" ? "live" : mode === "poll" ? "poll" : "");
  $("conn").textContent = { live: "Live", poll: "Polling", off: "Reconnecting" }[mode];
}

function addMetric(m) {
  state.metrics.push(m);
  const cutoff = m.timestamp - SPAN_SEC;
  while (state.metrics.length && state.metrics[0].timestamp < cutoff) state.metrics.shift();
  $("rate").textContent = pct(m.error_rate);
  $("baseline").textContent = m.warming_up ? "learning" : pct(m.baseline);
}

function addAlert(a, fresh) {
  if (state.alerts.some(x => x.id === a.id)) return;
  state.alerts.unshift(a);
  const feed = $("feed");
  feed.querySelector(".empty")?.remove();
  const li = document.createElement("li");
  li.className = "alert" + (fresh ? " fresh" : "");
  li.style.setProperty("--c", sevVar(a.severity));
  li.innerHTML = `<details><summary>
      <span class="sev">${sevLabel(a.severity)}</span>
      <span class="time">${clock(a.timestamp)}</span>
      <span class="nums">${pct(a.error_rate)} errors, normally ${pct(a.baseline)} <span class="z">(${a.errors} of ${a.total} lines)</span></span>
      <span class="z">z = ${a.z_score}</span>
    </summary><pre></pre></details>`;
  li.querySelector("pre").textContent = a.sample_lines.join("\n") || "No sample lines";
  feed.prepend(li);
  while (feed.children.length > 200) feed.lastChild.remove();
  $("count").textContent = state.alerts.length;
}

function draw() {
  const cv = $("chart"), dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const pad = { l: 44, r: 8, t: 10, b: 22 };
  const now = state.metrics.length ? state.metrics.at(-1).timestamp : Date.now() / 1000;
  const t0 = now - SPAN_SEC;
  const peak = Math.max(0.1, ...state.metrics.map(m => Math.max(m.error_rate, m.upper_band || 0)));
  const yMax = Math.ceil(peak * 1.15 * 20) / 20;
  const X = t => pad.l + (t - t0) / SPAN_SEC * (w - pad.l - pad.r);
  const Y = v => h - pad.b - v / yMax * (h - pad.t - pad.b);

  g.font = `11px ${css("--sans")}`; g.fillStyle = css("--muted"); g.strokeStyle = css("--grid"); g.lineWidth = 1;
  const step = yMax > 0.5 ? 0.2 : yMax > 0.2 ? 0.1 : 0.05;
  for (let v = 0; v <= yMax + 1e-9; v += step) {
    g.beginPath(); g.moveTo(pad.l, Y(v) + .5); g.lineTo(w - pad.r, Y(v) + .5); g.stroke();
    g.fillText(Math.round(v * 100) + "%", 4, Y(v) + 4);
  }
  for (let s = 0; s <= SPAN_SEC; s += 60) {
    const x = X(t0 + s);
    g.fillText(s === SPAN_SEC ? "now" : `-${(SPAN_SEC - s) / 60}m`, x - (s === SPAN_SEC ? 22 : 10), h - 5);
  }

  const learned = state.metrics.filter(m => !m.warming_up);
  if (learned.length > 1) {
    g.fillStyle = css("--band");
    g.beginPath();
    learned.forEach((m, i) => g[i ? "lineTo" : "moveTo"](X(m.timestamp), Y(m.upper_band)));
    for (let i = learned.length - 1; i >= 0; i--) g.lineTo(X(learned[i].timestamp), Y(Math.max(0, 2 * learned[i].baseline - learned[i].upper_band)));
    g.closePath(); g.fill();
  }

  for (const a of state.alerts) {
    if (a.timestamp < t0) continue;
    const x = Math.round(X(a.timestamp)) + .5;
    g.strokeStyle = css("--" + a.severity.toLowerCase()); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x, pad.t); g.lineTo(x, h - pad.b); g.stroke();
    g.fillStyle = g.strokeStyle; g.fillRect(x - 3, pad.t, 6, 6);
  }

  if (state.metrics.length > 1) {
    g.strokeStyle = css("--trace"); g.lineWidth = 1.75; g.lineJoin = "round";
    g.beginPath();
    state.metrics.forEach((m, i) => g[i ? "lineTo" : "moveTo"](X(m.timestamp), Y(m.error_rate)));
    g.stroke();
  }
  requestAnimationFrame(draw);
}

async function poll() {
  const since = state.metrics.at(-1)?.timestamp || 0;
  try {
    const [ms, as] = await Promise.all([
      fetch(`/api/metrics?since=${since}`).then(r => r.json()),
      fetch(`/api/alerts?since=${state.alerts[0]?.timestamp || 0}`).then(r => r.json()),
    ]);
    ms.forEach(addMetric); as.forEach(a => addAlert(a, true));
  } catch { /* server down; keep trying */ }
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  state.ws = ws;
  ws.onopen = () => { setConn("live"); clearInterval(state.pollTimer); state.pollTimer = null; };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "snapshot") {
      state.metrics = []; msg.data.metrics.forEach(addMetric);
      msg.data.alerts.forEach(a => addAlert(a, false));
    } else if (msg.type === "metric") addMetric(msg.data);
    else if (msg.type === "alert") addAlert(msg.data, true);
  };
  ws.onclose = () => {
    setConn(state.pollTimer ? "poll" : "off");
    if (!state.pollTimer) state.pollTimer = setInterval(() => { poll(); setConn("poll"); }, 2000);
    setTimeout(connect, 3000);
  };
}

connect();
requestAnimationFrame(draw);
</script>
</body>
</html>
